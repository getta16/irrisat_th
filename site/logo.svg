<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IRRISAT-THAI">
  <!--
    ตราสัญลักษณ์ IRRISAT-THAI — ดาวเทียมส่งสัญญาณลงมายังพื้นดิน
    วาดเป็นรูปทรงล้วน ไม่ฝังภาพบิตแมป จึงคมทุกขนาดตั้งแต่ favicon 16px ยันจอความละเอียดสูง
    สีเขียวตรงกับตัวแปรสีหลัก green (#17795e) ใน styles.css
    รูปทรงตั้งใจให้หนาและน้อยชิ้น เพราะรายละเอียดเล็ก ๆ จะเละเมื่อย่อลงเหลือ 16px
  -->
  <circle cx="32" cy="32" r="32" fill="#17795e" />

  <g fill="#ffffff">
    <!-- เสาอากาศ -->
    <rect x="30.6" y="7" width="2.8" height="7" rx="1.4" />
    <circle cx="32" cy="6.4" r="3.1" />

    <!-- ตัวดาวเทียม -->
    <rect x="26.4" y="14.4" width="11.2" height="17.4" rx="3.4" />

    <!-- ก้านต่อแผงโซลาร์ -->
    <rect x="21.6" y="21.5" width="5.4" height="3.2" rx="1.6" />
    <rect x="37" y="21.5" width="5.4" height="3.2" rx="1.6" />

    <!-- แผงโซลาร์ซ้าย–ขวา -->
    <rect x="7.6" y="17.5" width="14.4" height="11.2" rx="2.2" />
    <rect x="42" y="17.5" width="14.4" height="11.2" rx="2.2" />
  </g>

  <!-- ร่องแผงโซลาร์ — เจาะด้วยสีพื้นให้อ่านออกว่าเป็นแผงรับแสง -->
  <g stroke="#17795e" stroke-width="1.7" stroke-linecap="round">
    <path d="M12.4 18.6v9" />
    <path d="M17.2 18.6v9" />
    <path d="M46.8 18.6v9" />
    <path d="M51.6 18.6v9" />
  </g>

  <!-- ลำสัญญาณที่แผ่ลงสู่พื้น — ล้อลายคลื่นน้ำในโลโก้เดิม -->
  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round">
    <path d="M26.6 37.4q5.4 4.6 10.8 0" />
    <path d="M20.8 43.4q11.2 8.4 22.4 0" />
    <path d="M15 49.4q17 12.2 34 0" />
  </g>
</svg>
