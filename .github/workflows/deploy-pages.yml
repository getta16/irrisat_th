# เผยแพร่หน้า homepage และนโยบายความเป็นส่วนตัว (โฟลเดอร์ site/) ขึ้น GitHub Pages
#
# ตัวระบบจริงอยู่บน Cloud Run ที่เดียว (ดู Dockerfile) — หน้าบน Pages มีไว้เป็นลิงก์
# Homepage / Privacy policy ใน OAuth consent screen ของ Google ซึ่งบังคับให้อยู่บนโดเมน
# ที่ยืนยันความเป็นเจ้าของได้ ใช้โดเมน run.app ของ Google เองไม่ได้
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ทีละงาน ไม่ยกเลิกงานที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
